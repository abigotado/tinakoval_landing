# Deploys the site to GitHub Pages.
#
#   main  -> https://tinaksenia.com/         (production)
#   stage -> https://tinaksenia.com/stage/   (preview, noindex)
#
# Both branches are rebuilt on every run and merged into one Pages artifact, so
# a push to either branch never wipes the other one. The output is plain static
# files in dist/ with no Pages-specific runtime, so moving to another static
# host (e.g. Yandex Object Storage) only means replacing the last two steps.
#
# DNS records at the registrar (domain: tinaksenia.com):
#   apex  (@)   A      185.199.108.153
#               A      185.199.109.153
#               A      185.199.110.153
#               A      185.199.111.153
#   apex  (@)   AAAA   2606:50c0:8000::153
#               AAAA   2606:50c0:8001::153
#               AAAA   2606:50c0:8002::153
#               AAAA   2606:50c0:8003::153
#   www         CNAME  abigotado.github.io.
# Then in repo Settings -> Pages: Source = GitHub Actions, custom domain =
# tinaksenia.com, tick "Enforce HTTPS" once the certificate is issued. The
# CNAME file is written into the artifact below.
name: Deploy

on:
  push:
    branches: [main, stage]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stage
          path: stage
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: main/.nvmrc
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            stage/package-lock.json
      - name: Build main (site root)
        working-directory: main
        run: |
          npm ci
          npm run build
      - name: Build stage (/stage/)
        working-directory: stage
        env:
          DEPLOY_ENV: stage
        run: |
          npm ci
          npm run build
      - name: Assemble Pages artifact
        run: |
          mkdir _site
          cp -R main/dist/. _site/
          mkdir _site/stage
          cp -R stage/dist/. _site/stage/
          echo 'tinaksenia.com' > _site/CNAME
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
