# Deploys the site to GitHub Pages.
#
#   main  -> https://tinaksenia.com/         (production)
#   stage -> https://tinaksenia.com/stage/   (preview, noindex)
#
# Both branches are rebuilt on every run and merged into one Pages artifact, so
# a push to either branch never wipes the other one. Each branch builds in its
# own job, so nothing the stage build runs can touch the production output. If
# the stage build fails, production still deploys (without /stage/), but the
# run is red, so Release will not pick that stage head.
#
# The output is plain static files in dist/ with no Pages-specific runtime, so
# moving to another static host (e.g. Yandex Object Storage) only means
# replacing the assemble/deploy jobs.
#
# DNS records at the registrar (domain: tinaksenia.com):
#   apex  (@)   A      185.199.108.153
#               A      185.199.109.153
#               A      185.199.110.153
#               A      185.199.111.153
#   apex  (@)   AAAA   2606:50c0:8000::153
#               AAAA   2606:50c0:8001::153
#               AAAA   2606:50c0:8002::153
#               AAAA   2606:50c0:8003::153
#   www         CNAME  abigotado.github.io.
# Then in repo Settings -> Pages: Source = GitHub Actions, custom domain =
# tinaksenia.com, tick "Enforce HTTPS" once the certificate is issued. The
# CNAME file is written into the artifact below.
name: Deploy

on:
  push:
    branches: [main, stage]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  # No npm cache in the two build jobs: the production build must not restore
  # anything a stage build could have written.
  build-main:
    name: build-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-main
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-stage:
    name: build-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      # A re-run of an older stage commit must not roll /stage/ back. Runs queue
      # behind each other (concurrency: pages), so by the time this one starts a
      # newer stage head may already be live: then this run publishes nothing.
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          IS_STAGE_RUN: ${{ github.ref == 'refs/heads/stage' }}
          RUN_SHA: ${{ github.sha }}
        run: |
          current=true
          if [ "$IS_STAGE_RUN" = true ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/stage" --jq .sha)
            if [ "$head" != "$RUN_SHA" ]; then
              current=false
              echo "::notice::$RUN_SHA is no longer the stage head ($head); not publishing."
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      # A stage-triggered run builds exactly the commit it reports success for,
      # because Release trusts that SHA; other runs take the current stage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/stage' && github.sha || 'stage' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_ENV: stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-stage
          path: dist
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: assemble
    needs: [build-main, build-stage]
    if: ${{ !cancelled() && needs.build-main.result == 'success' && needs.build-stage.outputs.current != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-main
          path: _site
      - if: needs.build-stage.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-stage
          path: _site/stage
      - if: needs.build-stage.result != 'success'
        run: echo "::warning::Stage build did not succeed; publishing production without /stage/."
      - run: echo 'tinaksenia.com' > _site/CNAME
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
