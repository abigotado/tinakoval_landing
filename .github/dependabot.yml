version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: stage
    schedule:
      interval: monthly
    # Let a new release age a week before proposing it (security updates skip this).
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /
    target-branch: stage
    schedule:
      interval: monthly
    # Let a new release age a week before proposing it (security updates skip this).
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
